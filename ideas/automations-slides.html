<style>
:root{color-scheme:light only;--nc:#2F6FE0;--ns:#E8F0FD;--ink:#14201D;--ink2:#3A4542;--mute:#6F7A76;--line:#E5E0D4;--paper:#F7F5EF;--paper2:#F0ECE2;--ok:#0E9F6E;--no:#D63B4B;--card:#fff}

.grid{display:grid;gap:18px}

.nb span{position:absolute;left:46px;font:600 22px/1 "Bradley Hand","Segoe Print",cursive;color:#1E2B47}
.ph{position:absolute;right:0;top:0;width:200px;height:380px;border-radius:34px;background:#14201D;padding:12px;box-shadow:0 30px 60px -24px rgba(0,0,0,.5)}
.ph .sc{background:#fff;border-radius:24px;height:100%;padding:18px 14px;overflow:hidden}
.ph .sc .t{font-size:12px;font-weight:800;color:var(--mute);letter-spacing:.1em;text-transform:uppercase}
.ph .sc .h{font-size:18px;font-weight:800;margin:4px 0 10px}
.ph .it{display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:12px;padding:9px 10px;margin-bottom:8px;font-size:13px;line-height:1.25}
.ph .it i{width:8px;height:8px;border-radius:50%;background:var(--nc);flex-shrink:0}
.ph .it b{display:block;font-size:13.5px}
.bell{position:absolute;left:-10px;top:-34px;background:#fff;border-radius:16px;padding:10px 14px;box-shadow:0 14px 30px -14px rgba(0,0,0,.35);font-size:14px;font-weight:700;display:flex;gap:8px;align-items:center;animation:bob 4s ease-in-out infinite}
.bell b{color:var(--nc)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
/* today */
.today{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:6px}
.today .card{text-align:left;padding:22px}
.today .card .ico{background:var(--paper2);color:var(--ink2)}
.today .card h3{font-size:22px}
.punch{margin-top:26px;font-size:30px;font-weight:800;letter-spacing:-.02em}
.punch em{font-style:normal;color:var(--nc)}
/* pains */
.pains{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pain{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;font-size:19px;line-height:1.35;font-weight:600}
.pain .x{width:30px;height:30px;border-radius:50%;background:#FDECEE;color:var(--no);display:grid;place-items:center;flex-shrink:0;font-weight:800;font-size:16px;margin-top:1px}
/* big loss */
.loss{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;margin-top:4px}
.loss .card{padding:30px 32px}
.loss .big{font-size:96px;font-weight:800;letter-spacing:-.05em;line-height:1;color:var(--no)}
.loss .big.b{color:var(--ink)}
.loss .card p{font-size:22px;margin-top:10px}
/* app mock */
.app{display:grid;grid-template-columns:1.45fr .9fr;gap:26px;align-items:start}
.win{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 60px -30px rgba(20,32,29,.4);overflow:hidden}

.win .bar .dots{display:flex;gap:6px}.win .bar .dots i{width:11px;height:11px;border-radius:50%;background:#E3DED2}
.win .bar b{font-size:17px}
.win .bar .dt{margin-left:auto;font-size:14px;color:var(--mute);font-weight:700}
.win .body{padding:12px 16px}
.srch{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;font-size:17px;color:var(--mute)}
.srch input{border:0;outline:0;flex:1;font-size:17px;background:transparent;color:var(--ink)}
.found{font-size:15px;background:var(--ns);color:var(--ink);border-radius:12px;padding:9px 12px;margin-top:8px;display:none}
.found.on{display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.stats div{background:var(--paper);border-radius:14px;padding:10px 12px}
.stats b{display:block;font-size:22px;letter-spacing:-.02em;line-height:1.1}
.stats span{font-size:13px;color:var(--mute);font-weight:700}
.row{display:flex;align-items:center;gap:12px;padding:8px 4px;border-top:1px solid var(--line)}
.row .tg{font-size:12px;font-weight:800;letter-spacing:.04em;border-radius:999px;padding:4px 9px;white-space:nowrap}
.tg.r{background:#FDECEE;color:#A62A38}.tg.y{background:#FFF4DC;color:#8A5A10}.tg.b{background:var(--ns);color:var(--nc)}.tg.g{background:#E3F8EF;color:#0B7A55}
.row .nm{flex:1;min-width:0;font-size:16.5px;line-height:1.25}
.row .nm b{display:block}.row .nm span{font-size:14px;color:var(--mute)}
.row button{border:0;background:var(--nc);color:#fff;font-weight:800;font-size:14px;border-radius:999px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.row button.done{background:#E3F8EF;color:#0B7A55}
.row .ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);cursor:pointer;flex-shrink:0;display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px}
.row.ok .ck{background:var(--ok);border-color:var(--ok)}

.callouts{display:flex;flex-direction:column;gap:14px}
.co{display:flex;gap:14px;align-items:flex-start}
.co .n{width:40px;height:40px;border-radius:50%;background:var(--nc);color:#fff;font-weight:800;display:grid;place-items:center;flex-shrink:0;font-size:18px}
.co b{display:block;font-size:21px;line-height:1.25}
.co span{font-size:17px;color:var(--ink2)}
.demo-n{font-size:13px;color:var(--mute);margin-top:10px}
/* does by itself */
.auto{display:grid;grid-template-columns:1fr 1fr;gap:14px}.auto .card{padding:18px 22px}.auto .ico{width:44px;height:44px;margin-bottom:8px}.auto .ico svg{width:24px;height:24px}
.msgb{background:#E7F3EC;border-radius:18px 18px 18px 4px;padding:14px 16px;font-size:17px;line-height:1.45;margin-top:10px;color:#173B2E}
.notif{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:10px;font-size:16px}
.notif .ap{width:36px;height:36px;border-radius:10px;background:var(--nc);color:#fff;display:grid;place-items:center;font-weight:800;flex-shrink:0}
.notif b{display:block}
/* paths */
.paths{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.paths .card{position:relative;padding-top:28px}
.paths .tm{display:inline-block;margin-top:12px;font-size:16px;font-weight:800;background:#E3F8EF;color:#0B7A55;border-radius:999px;padding:5px 12px}
.arrowline{display:flex;align-items:center;gap:16px;margin-top:26px;font-size:24px;font-weight:800}
.arrowline .pill{background:var(--ink);color:#fff;border-radius:999px;padding:10px 20px}
.arrowline .pill.c{background:var(--nc)}
/* simple */
.simple{display:grid;grid-template-columns:1fr 1.1fr;gap:36px;align-items:center}
.btns{display:flex;flex-direction:column;gap:14px}
.btns div{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 22px;font-size:24px;font-weight:800;box-shadow:0 16px 36px -24px rgba(20,32,29,.3)}
.btns div span{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:24px;flex-shrink:0}
.ticks{list-style:none;display:flex;flex-direction:column;gap:14px}
.ticks li{position:relative;padding-left:44px;font-size:22px;line-height:1.35}
.ticks li::before{content:"✓";position:absolute;left:0;top:-1px;width:30px;height:30px;border-radius:50%;background:var(--ns);color:var(--nc);display:grid;place-items:center;font-weight:800;font-size:16px}
.ticks li b{color:var(--ink)}
/* calculator */
.calc{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:start}
.fld{display:grid;grid-template-columns:1fr 140px;gap:12px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
.fld:last-child{border-bottom:0}
.fld label{font-size:15px;line-height:1.3;color:var(--ink2);font-weight:600}
.fld .in{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.fld .in button{border:0;background:var(--paper);width:34px;height:34px;font-size:20px;font-weight:800;cursor:pointer;color:var(--ink2)}
.fld input{width:100%;border:0;outline:0;text-align:center;font-size:19px;font-weight:800;padding:8px 0;background:transparent;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.fld input::-webkit-outer-spin-button,.fld input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.res .vs{margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:17px}

.res .tier{display:inline-flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px;margin-left:auto;gap:2px}.res .tier button{flex:1}

.res .hrs{margin-top:8px;font-size:17px;color:#C9D6D1}
.res .hrs b{color:#fff}
.note{font-size:14px;color:var(--mute);margin-top:10px;padding-right:96px}
/* offer */
.offer{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.offer .card{text-align:center;padding:28px 18px}
.offer .v{font-size:52px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--nc)}
.offer .v small{font-size:20px;letter-spacing:0;color:var(--mute);font-weight:700}
.offer s{color:var(--mute);font-size:17px;text-decoration:none}
.offer h3{margin-top:10px;font-size:21px}
.offer p{font-size:16.5px}

.gua{display:grid;grid-template-columns:1fr 1fr;gap:22px}

.gua .shield h3{font-size:34px;line-height:1.15;letter-spacing:-.02em;margin:12px 0 10px}
.gua .shield p{font-size:20px;color:#C9D6D1}
.gua .shield .ico{background:rgba(255,255,255,.1);color:#7CF0B5}
/* about */
.about{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.about .v{font-size:60px;font-weight:800;letter-spacing:-.04em;color:var(--nc);line-height:1}
/* next */
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;counter-reset:s}
.steps3 .card{position:relative;padding-top:30px}
.steps3 .card::before{counter-increment:s;content:counter(s);position:absolute;top:-20px;left:24px;width:44px;height:44px;border-radius:50%;background:var(--nc);color:#fff;font-weight:800;display:grid;place-items:center;font-size:20px;box-shadow:0 0 0 6px var(--paper)}
.cta{margin-top:30px;display:flex;align-items:center;gap:18px;font-size:22px}
.cta b{font-size:30px;letter-spacing:-.01em}
/* chrome */
.calcS .pg{display:none}
.nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(20,32,29,.86);color:#fff;border-radius:999px;padding:6px 8px;z-index:5;opacity:.15;transition:opacity .3s}
.nav:hover,.nav.show{opacity:1}
.nav button{border:0;background:transparent;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;font-weight:800}
.nav button:hover{background:rgba(255,255,255,.12)}
.nav .c{font-size:13px;font-weight:800;letter-spacing:.06em;min-width:56px;text-align:center}
.prog{position:fixed;left:0;top:0;height:4px;background:var(--nc);z-index:6;transition:width .4s cubic-bezier(.2,.8,.2,1)}
/* print */
body.print{overflow:visible;background:#fff}
body.print .vp{position:static;display:block}
body.print .stage{transform:none!important;width:1280px;height:auto}
body.print .s{position:relative;opacity:1;visibility:visible;border-radius:0;box-shadow:none;width:1280px;height:720px;page-break-after:always;break-after:page}
body.print .s .a{opacity:1;transform:none;transition:none}
body.print .nav,body.print .prog{display:none}
@page{size:1280px 720px;margin:0}
@media print{html,body{overflow:visible;height:auto;background:#fff}.vp{position:static;display:block}.stage{transform:none!important;height:auto}.s{position:relative;opacity:1!important;visibility:visible!important;border-radius:0;box-shadow:none;page-break-after:always;break-after:page}.s .a{opacity:1!important;transform:none!important}.nav,.prog{display:none}}
@media(prefers-reduced-motion:reduce){.s,.s .a{transition:none}.bell{animation:none}}
</style>
